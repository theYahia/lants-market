name: snapshot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Who triggered the run: manual (always publishes) or cron (skips when the live snapshot is fresh)'
        required: false
        default: manual
        type: string

env:
  SELLERS_FILE: sellers.json
  IPNS_KEY: k51qzi5uqu5di86efhnadxw0k1sxnuo2tkcmegxcn2ra2r3exyfpv9htxhit6b

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to run
        id: decide
        env:
          IPNS_KEY: ${{ env.IPNS_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE: ${{ github.event.inputs.source }}
        run: |
          set -uo pipefail
          URL="https://raw.githubusercontent.com/theYahia/lants-market/data/live.json"
          # Fetch live snapshot; any failure => empty body => treated as stale.
          curl -sS --max-time 30 -o live.json "${URL}" || echo '{}' > live.json
          [ -s live.json ] || echo '{}' > live.json
          node <<'NODE'
          const fs = require('fs');

          // Last slot boundary among 06:00/14:00/22:00 UTC that is <= now.
          const now = new Date();
          const slots = [6, 14, 22];
          let slot = new Date(Date.UTC(
            now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 22, 0, 0, 0));
          const h = now.getUTCHours();
          if (h < 6) {
            // 00:00–05:59 UTC -> previous day 22:00
            slot = new Date(slot.getTime() - 24 * 3600 * 1000);
          } else {
            const boundary = slots.filter(s => s <= h).pop(); // 6, 14, or 22
            slot = new Date(Date.UTC(
              now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), boundary, 0, 0, 0));
          }

          let liveTs = null;
          try {
            const live = JSON.parse(fs.readFileSync('live.json', 'utf8'));
            if (live && live.generatedAt) {
              const d = new Date(live.generatedAt);
              if (!isNaN(d.getTime())) liveTs = d;
            }
          } catch (e) {
            // treat as stale
          }

          const event = process.env.EVENT_NAME || '';
          const source = process.env.SOURCE || '';
          const slotIso = slot.toISOString();
          let run = true;

          // Apply freshness gate for scheduled runs or cron‑triggered workflow_dispatch.
          if (event === 'schedule' || (event === 'workflow_dispatch' && source === 'cron')) {
            if (liveTs && liveTs.getTime() >= slot.getTime()) {
              run = false;
              console.log(`fresh for slot ${slotIso} (live ${liveTs.toISOString()}), skipping`);
            } else {
              console.log(`stale for slot ${slotIso} (live ${liveTs ? liveTs.toISOString() : 'none'}), running`);
            }
          } else {
            console.log(`event=${event} source=${source} -> always run`);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run=${run}\n`);
          NODE

      - name: Setup Node
        if: steps.decide.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.decide.outputs.run == 'true'
        run: npm ci || npm install

      - name: Fetch antscan sellers
        if: steps.decide.outputs.run == 'true'
        continue-on-error: true
        run: curl -sf -o sellers.json https://antscan.co/api/sellers

      - name: Enrich snapshot
        if: steps.decide.outputs.run == 'true'
        run: node site/enrich-snapshot.mjs

      - name: Enrich sales
        if: steps.decide.outputs.run == 'true'
        run: node site/enrich-sales.mjs --sellers sellers.json

      - name: Sanity check (gate — fail without publishing)
        if: steps.decide.outputs.run == 'true'
        run: node site/sanity-check.mjs

      - name: Build dist
        if: steps.decide.outputs.run == 'true'
        run: node scripts/site/build-dist.mjs

      - name: Publish (CAR + IPNS)
        if: steps.decide.outputs.run == 'true'
        env:
          FILEBASE_KEY: ${{ secrets.FILEBASE_KEY }}
          FILEBASE_SECRET: ${{ secrets.FILEBASE_SECRET }}
        run: |
          set -euo pipefail
          node scripts/deploy/publish.mjs | tee publish.log

      - name: Verify published snapshot
        if: steps.decide.outputs.run == 'true'
        run: |
          set -euo pipefail

          # Expected generatedAt from the freshly built snapshot
          if ! EXPECTED=$(node -e "console.log(require('./dist/fixtures/snapshot-e23.live.json').generatedAt)") || [ -z "$EXPECTED" ]; then
            echo "FAILED: expected snapshot file ./dist/fixtures/snapshot-e23.live.json not found or missing generatedAt"
            exit 1
          fi

          # Extract CID from publish.log
          if ! CID=$(grep -oE 'root CID = [^ ]+' publish.log | awk '{print $4}'); then
            echo "FAILED: could not parse CID from publish.log"
            exit 1
          fi
          if [ -z "$CID" ]; then
            echo "FAILED: CID is empty after parsing publish.log"
            exit 1
          fi

          # HARD check: poll the direct CID URL
          HARD_URL="https://ipfs.filebase.io/ipfs/${CID}/fixtures/snapshot-e23.live.json"
          hard_ok=0
          for attempt in $(seq 1 10); do
            echo "hard check attempt ${attempt}: ${HARD_URL}"
            code=$(curl -sS --max-time 30 -o body.json -w '%{http_code}' "${HARD_URL}" || echo 000)
            if [ "$code" = "200" ]; then
              GOT=$(node -e "console.log(require('./body.json').generatedAt)" 2>/dev/null || echo "")
              echo "attempt ${attempt}: HTTP ${code}, got ${GOT}, expected ${EXPECTED}"
              if [ "$GOT" = "$EXPECTED" ]; then
                echo "published snapshot OK: ${CID} ${EXPECTED}"
                hard_ok=1
                break
              fi
            else
              echo "attempt ${attempt}: HTTP ${code}, retrying..."
            fi
            sleep 30
          done

          if [ "$hard_ok" != "1" ]; then
            echo "FAILED: CID ${CID} does not serve the new snapshot"
            exit 1
          fi

          # SOFT check: IPNS gateway (non‑fatal)
          IPNS_URL="https://ipfs.filebase.io/ipns/${IPNS_KEY}/fixtures/snapshot-e23.live.json"
          if curl -sS --max-time 30 -o ipns_body.json "${IPNS_URL}"; then
            GOT_IPNS=$(node -e "console.log(require('./ipns_body.json').generatedAt)" 2>/dev/null || echo "")
            if [ "$GOT_IPNS" = "$EXPECTED" ]; then
              echo "IPNS already serves the new snapshot"
            else
              echo "::warning::IPNS gateway still serves ${GOT_IPNS}; propagation usually takes ~15 minutes"
            fi
          else
            echo "::warning::IPNS gateway fetch failed; propagation usually takes ~15 minutes"
          fi

      - name: Update data branch
        if: steps.decide.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CID=$(grep -oE 'root CID = [^ ]+' publish.log | awk '{print $4}'); [ -n "$CID" ] || { echo "no CID"; exit 1; }
          rm -rf data-out && mkdir data-out
          node -e "const s=require('./dist/fixtures/snapshot-e23.live.json'); s.cid=process.argv[1]; require('fs').writeFileSync('data-out/live.json', JSON.stringify(s))" "$CID"
          cd data-out && git init -q && git checkout -q --orphan data && git add live.json
          GEN=$(node -e "console.log(require('./live.json').generatedAt)")
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "chore(data): live snapshot $GEN ($CID)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "data branch updated: $GEN $CID"