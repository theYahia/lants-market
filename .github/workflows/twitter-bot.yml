name: twitter-bot

# Plan T5/T6: manual dispatch first, then enable the hourly schedule.
# Uncomment `schedule` only after the first post is verified on @sxsiant.
on:
  # schedule:
  #   - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print pending posts without tweeting or writing state'
        required: false
        type: boolean
        default: false

concurrency:
  group: twitter-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore bot state
        id: state-restore
        uses: actions/cache/restore@v4
        with:
          path: bot/state.json
          key: twitter-bot-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            twitter-bot-state-${{ github.ref_name }}-

      - name: Feed diagnostic
        run: |
          node --input-type=module -e '
            import { fetchSeaportMarket } from "./site/seaport-feed.mjs";
            import { toMarket } from "./bot/read-feed.mjs";
            const feed = await fetchSeaportMarket({ timeoutMs: 8000, includeNonFulfillable: true });
            console.log("fetchSeaportMarket.ok:", feed.ok, "reason:", feed.reason);
            console.log("normalized items.len:", feed.items && feed.items.length, "listedCount:", feed.listedCount);
            if (Array.isArray(feed.items)) {
              feed.items.slice(0, 8).forEach((it) => {
                console.log("norm id=" + it.id + " amount=" + JSON.stringify(it.amount) + " perAntUsd=" + JSON.stringify(it.perAntUsd) + " priceUsdc=" + JSON.stringify(it.priceUsdc));
              });
            }
            const m = toMarket(feed);
            console.log("toMarket:", m === null ? "null" : "listings=" + m.listings.length);
          ' 2>&1 | tee feed-diag.log

      - name: Run bot
        env:
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node bot/run.mjs 2>&1 | tee bot-run.log

      - name: Save bot state
        if: always() && hashFiles('bot/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: bot/state.json
          key: twitter-bot-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Summarize
        if: always()
        run: |
          {
            echo "Twitter bot run finished with status ${{ job.status }}."
            echo ""
            echo "dry_run=${{ inputs.dry_run }}"
            echo '```'
            cat bot-run.log 2>/dev/null || echo "(no bot-run.log)"
            echo '```'
            echo ""
            echo '```'
            cat feed-diag.log 2>/dev/null || echo "(no feed-diag.log)"
            echo '```'
            echo ""
            if [ -f bot/state.json ]; then
              echo "state.json written ($(wc -c < bot/state.json) bytes)"
            else
              echo "state.json NOT written"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
